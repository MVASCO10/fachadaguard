[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fachadaguard"
version = "0.1.0"
description = "Protótipo acadêmico de triagem de anomalias em fachadas com drone (IoT), Big Data e IA."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "psycopg[binary]>=3.2,<3.3",
  "paho-mqtt>=2.1,<2.2",
  "opencv-python-headless>=4.10,<4.11",
  "scikit-image>=0.24,<0.25",
  "scikit-learn>=1.5,<1.6",
  "numpy>=2.1,<2.2",
  "duckdb>=1.1,<1.2",
  "pyarrow>=18,<19",
  "jinja2>=3.1,<3.2",
  "python-multipart>=0.0.17",
  "joblib>=1.4,<1.5",
  "httpx>=0.28,<0.29",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<1.41", "plotly>=5.24,<5.25", "pandas>=2.2,<2.3"]
eval = ["matplotlib>=3.9,<3.10"]
genai = ["anthropic>=1,<2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7", "mypy>=1.13"]

[tool.setuptools.packages.find]
include = ["fachadaguard*", "apps*", "services*", "simulator*"]

[tool.setuptools.package-data]
"fachadaguard.reporting" = ["templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["fachadaguard"]

[[tool.mypy.overrides]]
# os stubs do OpenCV são incompletos/estritos demais para numpy genérico; tratamos cv2 como Any
module = ["cv2", "cv2.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requer a stack Docker (Postgres + Mosquitto + API) em execução",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["fachadaguard"]
omit = ["fachadaguard/reporting/genai.py"]
