# Broker de DEMONSTRAÇÃO. Autenticação obrigatória; TLS preparado (ver listener 8883 abaixo).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Sessões persistentes guardam mensagens QoS 1 enquanto o ingestor está desconectado.
max_queued_messages 500000
max_inflight_messages 2000
persistent_client_expiration 2d

listener 1883
protocol mqtt

# Produção: habilite TLS (e desabilite a porta 1883) montando certificados em /mosquitto/certs.
# listener 8883
# protocol mqtt
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
