name: fachadaguard

x-app: &app
  build: .
  image: fachadaguard:0.1.0
  restart: unless-stopped
  env_file: .env
  environment: &appenv
    FG_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    FG_MQTT_HOST: mosquitto
    FG_MQTT_PORT: "1883"
    FG_API_BASE_URL: http://api:8000
  volumes:
    - fg_data:/app/data
    - fg_artifacts:/app/artifacts
  depends_on:
    postgres: { condition: service_healthy }
    mosquitto: { condition: service_healthy }

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/fg/entrypoint.sh"]
    environment:
      MQTT_DRONE_PASSWORD: ${MQTT_DRONE_PASSWORD}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD}
    volumes:
      - ./docker/mosquitto:/fg:ro
      - mqtt_data:/mosquitto/data
    ports: ["1883:1883"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      start_period: 3s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pg_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "apps.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  ingestor:
    <<: *app
    command: ["python", "-m", "services.mqtt_ingestor.main"]
    environment:
      <<: *appenv
      FG_MQTT_USERNAME: fg_ingestor
      FG_MQTT_PASSWORD: ${MQTT_INGESTOR_PASSWORD}
      FG_MQTT_CLIENT_ID: fg-ingestor-1

  worker:
    <<: *app
    command: ["python", "-m", "services.ai_worker.main"]

  dashboard:
    <<: *app
    command: ["streamlit", "run", "apps/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--browser.gatherUsageStats=false", "--client.toolbarMode=viewer"]
    ports: ["8501:8501"]
    depends_on:
      api: { condition: service_healthy }

  simulator:
    <<: *app
    restart: "no"
    profiles: ["tools"]
    entrypoint: ["python", "-m", "simulator.drone"]
    environment:
      <<: *appenv
      FG_MQTT_USERNAME: fg_drone
      FG_MQTT_PASSWORD: ${MQTT_DRONE_PASSWORD}
    depends_on:
      api: { condition: service_healthy }

volumes:
  pg_data:
  mqtt_data:
  fg_data:
  fg_artifacts:
